# Production-shaped stack: Caddy (TLS) → api, worker, one-shot migrate, PostgreSQL, Valkey.
# The signer is NOT here on purpose: run it on its own host (deploy/signer/).
#
#   cp deploy/env.example deploy/.env     # then edit
#   mkdir -p deploy/secrets && (generate secrets as shown in docs/deployment.md)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# NOT TESTED IN THE AUTHORING SANDBOX (no Docker daemon there): read it, run it on a
# staging machine with testnets first, and see docs/deployment.md.
name: actualpay

x-app: &app
  image: ${ACTUALPAY_IMAGE:?set ACTUALPAY_IMAGE, e.g. ghcr.io/you/actualpay:1.0.0}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 256
  environment: &app-env
    APP_ENV: production
    NETWORK_MODE: ${NETWORK_MODE:-mainnet}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
    ENABLED_ASSETS: ${ENABLED_ASSETS:?}
    CUSTODY_MODE: ${CUSTODY_MODE:-merchant}
    TRUST_PROXY: 'true' # Caddy is the only thing that can reach the API
    API_HOST: 0.0.0.0
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL_FILE: /run/secrets/database_app_url
    REDIS_URL_FILE: /run/secrets/redis_url
    SESSION_SECRET_FILE: /run/secrets/session_secret
    ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    SMTP_HOST: ${SMTP_HOST:?}
    SMTP_PORT: ${SMTP_PORT:?}
    SMTP_FROM: ${SMTP_FROM:?}
    SMTP_USERNAME_FILE: /run/secrets/smtp_username
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:?}
    # Chain nodes: your own, reachable from the worker. Add the ones for the assets you enable.
    BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-}
    BITCOIN_RPC_USERNAME: ${BITCOIN_RPC_USERNAME:-}
    BITCOIN_RPC_PASSWORD_FILE: /run/secrets/bitcoin_rpc_password
    ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
    XRPL_WS_URL: ${XRPL_WS_URL:-}
    TRON_API_URL: ${TRON_API_URL:-}
    # Platform custody only (leave empty otherwise):
    WITHDRAWAL_SEAL_KEY_FILE: /run/secrets/withdrawal_seal_key
  secrets:
    - database_app_url
    - redis_url
    - session_secret
    - encryption_key
    - smtp_username
    - smtp_password
    - bitcoin_rpc_password
    - withdrawal_seal_key
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '10' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    secrets: [postgres_superuser_password, database_owner_password, database_app_password]
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d actualpay']
      interval: 10s
      timeout: 3s
      retries: 20
    # No ports: only containers on the backend network can reach the database.

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes
    volumes: [valkey-data:/data]
    secrets: [redis_password]
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'valkey-cli -a "$$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations as the OWNER role, then grants the app role its rights.
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/db.mjs', 'migrate']
    healthcheck: { disable: true }
    environment:
      DATABASE_URL_FILE: /run/secrets/database_owner_url
      DATABASE_APP_ROLE: actualpay_app
    secrets: [database_owner_url]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *app
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    networks: [backend, egress, edge]
    mem_limit: 512m

  worker:
    <<: *app
    command: ['node', 'dist/worker.mjs', 'start']
    healthcheck: { disable: true } # the worker listens on no port; watch `worker:status` and issues instead
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      ACTUALPAY_DOMAIN: ${ACTUALPAY_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    networks: [edge, egress]
    depends_on: [api]

networks:
  # Database and cache live here and have no route to the internet.
  backend: { internal: true }
  # Outbound internet (chain nodes, SMTP, webhook receivers, ACME).
  egress: {}
  # Caddy ↔ api only.
  edge: { internal: true }

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_superuser_password: { file: ./secrets/postgres_superuser_password }
  database_owner_password: { file: ./secrets/database_owner_password }
  database_app_password: { file: ./secrets/database_app_password }
  database_owner_url: { file: ./secrets/database_owner_url }
  database_app_url: { file: ./secrets/database_app_url }
  redis_password: { file: ./secrets/redis_password }
  redis_url: { file: ./secrets/redis_url }
  session_secret: { file: ./secrets/session_secret }
  encryption_key: { file: ./secrets/encryption_key }
  smtp_username: { file: ./secrets/smtp_username }
  smtp_password: { file: ./secrets/smtp_password }
  bitcoin_rpc_password: { file: ./secrets/bitcoin_rpc_password }
  withdrawal_seal_key: { file: ./secrets/withdrawal_seal_key }
